name: CI

# 质量门禁：类型检查 → 只读 lint → 单元测试 → 完整构建 → 扩展打包与产物上传
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # GitHub 原生不认提交信息里的 [skip ci]，这里显式实现：头部提交带标记就整轮跳过。
    # 需要绕过本地门禁的文档 / 低风险提交时，在提交信息末尾加 [skip ci] 即可。
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段（pnpm@10.17.0）。
      # 注意：不要同时传 version，否则 action 会因重复指定版本而直接报错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 版本单一来源：读取 package.json 的 volta.node（当前 24.8.0），升级 volta 后 CI 自动跟随
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      # 只读校验：本地的 `pnpm lint` 带 --fix，会在 CI 里改写工作区文件
      - name: Lint (read-only)
        run: pnpm lint:check

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      # 打包带版本号的 ZIP 压缩包（例如 panda-dock-v1.0.0.zip）
      - name: Package extension
        id: package
        run: pnpm package

      # 上传至 GitHub Actions Artifacts（压缩包名称携带当前版本号）
      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

      # 推送版本标签（如 v1.1.0）时自动创建 GitHub Release 并挂载压缩包。
      # 正文取 annotated tag 的注释（发版的 changelog 写在 `git tag -a` 的注释里），
      # 不能用 generate_release_notes：那会把正文覆盖成自动生成的 compare 链接。
      # 注意：发版一律用 `git tag -a`，轻量 tag 没有注释 → 正文会是空的。
      - name: Read tag notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # checkout 默认浅克隆，先补齐 tag 对象才能读到注释
          git fetch --tags --force --quiet
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive_path }}
          body_path: ${{ runner.temp }}/release-notes.md
